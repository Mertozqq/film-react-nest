services:
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/mertozqq/film-react-nest-frontend:review
    volumes:
      - frontend_dist:/frontend-dist
    healthcheck:
      test: ["CMD-SHELL", "test -f /frontend-dist/index.html"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: ghcr.io/mertozqq/film-react-nest-backend:review
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/mertozqq/film-react-nest-nginx:review
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./nginx/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app_network

volumes:
  frontend_dist:
  postgres_data:
  pgadmin_data:

networks:
  app_network:
    driver: bridge
